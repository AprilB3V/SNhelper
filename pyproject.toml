[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "snhelper"
version = "0.1.0"
description = "A cognitive exoskeleton built around a router and four personal AI agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
langchain = [
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
]
dev = ["pytest>=8"]
web = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "httpx>=0.27,<1",
]

[project.scripts]
snhelper = "snhelper.cli:main"

[tool.setuptools.packages.find]
include = ["snhelper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
